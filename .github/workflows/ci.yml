name: EchoLabyrinth_SFML C++17 CI (Windows MSVC & Ubuntu GCC)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ubuntu-gcc:
    name: Ubuntu 22.04 (GCC C++17 + SFML + Self-Test)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SFML 2.5+ & OpenAL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsfml-dev libopenal-dev

      - name: Configure CMake (Release)
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build EchoLabyrinth_SFML (Zero Warnings Check)
        run: cmake --build build -j4

      - name: Run 12-Suite Deterministic Self-Test
        run: ./build/EchoLabyrinth_SFML --self-test

  windows-msvc:
    name: Windows 2022 (MSVC C++17 + SFML 2.6.1 + Self-Test)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Visual Studio 17 2022 x64)
        run: cmake -S cpp -B build -G "Visual Studio 17 2022" -A x64 -DECHO_AUTO_FETCH_SFML=ON

      - name: Build EchoLabyrinth_SFML (Release x64)
        run: cmake --build build --config Release --parallel 4

      - name: Run 12-Suite Deterministic Self-Test
        run: .\build\Release\EchoLabyrinth_SFML.exe --self-test
