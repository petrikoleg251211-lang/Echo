name: EchoLabyrinth C++17 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ubuntu-gcc:
    name: Ubuntu 24.04 (GCC 13, C++17, Release)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SFML system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxrandr-dev libxcursor-dev libudev-dev \
            libopenal-dev libflac-dev libvorbis-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libfreetype-dev xvfb

      - name: Cache SFML FetchContent Dependencies
        uses: actions/cache@v4
        with:
          path: cpp/build/_deps
          key: ${{ runner.os }}-gcc-sfml-2.6.1

      - name: Configure CMake
        working-directory: cpp
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build EchoLabyrinth_SFML
        working-directory: cpp
        run: cmake --build build --config Release --parallel 4

      - name: Run Deterministic 18-Suite Self-Test (Headless)
        working-directory: cpp/build/bin
        run: xvfb-run --auto-servernum ./EchoLabyrinth_SFML --self-test

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoLabyrinth-Linux-x64
          path: |
            cpp/build/bin/EchoLabyrinth_SFML
            cpp/build/bin/assets/
          if-no-files-found: error

  ubuntu-asan-ubsan:
    name: Ubuntu 24.04 (ASan + UBSan Sanitizer Verification)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SFML system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxrandr-dev libxcursor-dev libudev-dev \
            libopenal-dev libflac-dev libvorbis-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libfreetype-dev xvfb

      - name: Cache SFML FetchContent Dependencies
        uses: actions/cache@v4
        with:
          path: cpp/build-san/_deps
          key: ${{ runner.os }}-san-sfml-2.6.1

      - name: Configure CMake with ASan + UBSan
        working-directory: cpp
        run: cmake -B build-san -DCMAKE_BUILD_TYPE=RelWithDebInfo -DECHO_ENABLE_SANITIZERS=ON

      - name: Build EchoLabyrinth_SFML (Sanitized)
        working-directory: cpp
        run: cmake --build build-san --parallel 4

      - name: Run 18-Suite Self-Test under ASan + UBSan
        working-directory: cpp/build-san/bin
        env:
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: xvfb-run --auto-servernum ./EchoLabyrinth_SFML --self-test

  windows-msvc:
    name: Windows 2022 (MSVC C++17, Release)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache SFML FetchContent Dependencies
        uses: actions/cache@v4
        with:
          path: cpp/build/_deps
          key: ${{ runner.os }}-msvc-sfml-2.6.1

      - name: Configure CMake
        working-directory: cpp
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build EchoLabyrinth_SFML
        working-directory: cpp
        run: cmake --build build --config Release --parallel 4

      - name: Run Deterministic 18-Suite Self-Test
        working-directory: cpp/build/bin/Release
        run: .\EchoLabyrinth_SFML.exe --self-test

      - name: Upload Windows Build Artifact (.exe + DLLs + assets/)
        uses: actions/upload-artifact@v4
        with:
          name: EchoLabyrinth-Windows-x64
          path: |
            cpp/build/bin/Release/*.exe
            cpp/build/bin/Release/*.dll
            cpp/build/bin/Release/assets/
          if-no-files-found: error
